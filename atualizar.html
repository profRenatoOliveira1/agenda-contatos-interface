<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg" href="/assets/contact.svg">
    <title>Agenda de Contatos - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="/css/estilo.css">
</head>

<body onload="buscarContato()">
    <ul class="nav nav-tabs">
        <li class="nav-item">
            <a class="nav-link" aria-current="page" href="/index.html">Home</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/cadastro.html">Cadastro</a>
        </li>
        <li class="nav-item">
            <a class="nav-link active" href="/atulizar.html">Atualizar</a>
        </li>
    </ul>
    <h1 class="text-primary">Atualizar Contato</h1>

    <form action="" method="post" onsubmit="enviarFormularioAtualizacao(event)">
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="floatingInputId" placeholder="ID Contato" disabled>
            <label for="floatingInput">ID Contato</label>
        </div>
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="floatingInputNome" placeholder="Nome completo" required>
            <label for="floatingInput">Nome completo *</label>
        </div>
        <div class="form-floating mb-3">
            <input type="number" class="form-control" id="floatingInputTelefone" placeholder="Telefone">
            <label for="floatingInput">Telefone</label>
        </div>
        <div class="form-floating mb-3">
            <input type="email" class="form-control" id="floatingInputEmail" placeholder="name@example.com">
            <label for="floatingInput">Endereço de E-mail</label>
        </div>
        <div class="form-floating mb-3">
            <input type="date" class="form-control" id="floatingInputAniversario" placeholder="Aniversário">
            <label for="floatingInput">Aniversário</label>
        </div>
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="floatingInputEndereco" placeholder="Endereço">
            <label for="floatingInput">Endereço</label>
        </div>
        <p class="text-danger">* Campos obrigatórios</p>

        <div class="col-12">
            <input class="btn btn-primary" type="submit" />
        </div>
    </form>

    <script src="./js/contatos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
